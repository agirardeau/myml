name: CI

on:
  pull_request:
  push:

permissions:
  contents: read

jobs:
  serde-myml:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Check formatting
        run: cargo fmt --manifest-path libs/serde-myml/Cargo.toml --all -- --check

      - name: Run test suite
        run: cargo test --manifest-path libs/serde-myml/Cargo.toml --locked --all-targets

      - name: Verify package
        run: cargo package --manifest-path libs/serde-myml/Cargo.toml --locked

  py-myml:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.13", "3.14"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Build package
        run: uv build libs/py-myml

      - name: Run test suite
        run: uv run python -m unittest discover libs/py-myml/tests

  py-myml-tiny:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.13", "3.14"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Build package
        run: uv build libs/py-myml-tiny

      - name: Run test suite
        run: uv run python -m unittest discover libs/py-myml-tiny/tests
