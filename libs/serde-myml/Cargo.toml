[package]
name = "serde-myml"
version = "0.2.0"
edition = "2021"
license = "MIT"
description = "Serde parser and emitter for Myml"
repository = "https://github.com/agirardeau/myml"
readme = "README.md"
exclude = ["tests/corpus.rs"]

[dependencies]
serde = "1"

[dev-dependencies]
serde = { version = "1", features = ["derive"] }
