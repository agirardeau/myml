name: Serde Myml Tag

on:
  push:
    tags:
      - "serde-myml-v*"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Check tag version
        shell: bash
        run: |
          set -euo pipefail
          version="$(python3 - <<'PY'
          import tomllib
          with open('libs/serde-myml/Cargo.toml', 'rb') as manifest:
              print(tomllib.load(manifest)['package']['version'])
          PY
          )"
          if [[ "$GITHUB_REF_NAME" != "serde-myml-v$version" ]]; then
            echo "tag $GITHUB_REF_NAME does not match crate version $version" >&2
            exit 1
          fi

      - name: Check formatting
        run: cargo fmt --manifest-path libs/serde-myml/Cargo.toml --all -- --check

      - name: Run test suite
        run: cargo test --manifest-path libs/serde-myml/Cargo.toml --locked --all-targets

      - name: Verify package
        run: cargo package --manifest-path libs/serde-myml/Cargo.toml --locked
